# =============================================================================
# Armiga — genimage.cfg
# Layout de la imagen SD para Anbernic RG40XX H
#
# CAMBIO (versión intermedia particionado):
#   - kickstarts.ext2 + roms.ext2 fusionadas en una única partición amiga_data
#   - rootfs pasa a montarse ro (ver fstab) — amiga_data sigue siendo rw
#   - Libera un slot MBR (quedan 3 de 4 primarias en uso) para un futuro
#     esquema A/B si se decide dar ese paso más adelante.
# =============================================================================
image boot.vfat {
	vfat {
		label = "boot"
		file "KERNEL" {
			image = "KERNEL"
		}
		file "dtb.img" {
			image = "dtb.img"
		}
		file "extlinux/extlinux.conf" {
			image = "extlinux.conf"
		}
	}
	size = 64M
}

# NOTA: genimage no soporta exFAT como tipo de filesystem nativo
# (a diferencia de vfat/ext2/ext4). La imagen amiga_data.img se genera
# ANTES de invocar genimage, en post-image.sh, con mkfs.exfat sobre un
# fichero en blanco. genimage la trata aquí como imagen pre-existente.
# Ver board/armiga/post-image.sh para el paso de creación.

image armiga.img {
	hdimage {
		gpt = false
	}
	partition boot {
		image = "boot.vfat"
		partition-type = 0x1c
		offset = 2M
		bootable = true
	}
	partition system {
		image = "rootfs.ext4"
		partition-type = 0x83
	}
	partition amiga_data {
		# Pre-generada en post-image.sh con mkfs.exfat.
		# partition-type 0x07 es el código MBR estándar para exFAT/NTFS.
		image = "amiga_data.img"
		partition-type = 0x07
	}
}
