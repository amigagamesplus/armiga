name: Build PUAE2021 libretro core

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Tag/branch de libretro-uae a compilar'
        required: true
        default: '2.6.1'

env:
  GCC_VERSION: '16.1.0'
  TARGET: aarch64-linux-gnu
  TOOLCHAIN_PREFIX: /opt/gcc-16.1-aarch64

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Install build deps + cross libc/binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            flex bison texinfo wget \
            binutils-aarch64-linux-gnu libc6-dev-arm64-cross libc6-arm64-cross

      - name: Cache aarch64-linux-gnu-gcc 16.1
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_PREFIX }}
          key: gcc-${{ env.GCC_VERSION }}-${{ env.TARGET }}-ubuntu24.04-v1

      - name: Fix cross libc linker script absolute paths
        run: |
          echo ">>> antes:"
          cat /usr/aarch64-linux-gnu/lib/libc.so
          sudo sed -i 's#/usr/aarch64-linux-gnu/lib/##g' /usr/aarch64-linux-gnu/lib/libc.so
          echo ">>> despues:"
          cat /usr/aarch64-linux-gnu/lib/libc.so

      - name: Build gcc 16.1 aarch64 cross toolchain from source
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://ftpmirror.gnu.org/gcc/gcc-${GCC_VERSION}/gcc-${GCC_VERSION}.tar.xz"
          tar xf "gcc-${GCC_VERSION}.tar.xz"
          cd "gcc-${GCC_VERSION}"
          mkdir build && cd build
          ../configure \
            --target=${TARGET} \
            --prefix=${TOOLCHAIN_PREFIX} \
            --enable-languages=c,c++ \
            --disable-multilib \
            --disable-bootstrap \
            --with-sysroot=/usr/${TARGET} \
            --with-native-system-header-dir=/include
          make -j$(nproc)
          sudo make install

      - name: Export toolchain to PATH
        run: echo "${TOOLCHAIN_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Verify compiler version
        run: |
          ${TARGET}-gcc --version
          ${TARGET}-g++ --version

      - name: Clone libretro-uae
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.branch }}" https://github.com/libretro/libretro-uae.git source
          cd source
          echo ">>> Commit compilado:"
          git log -1 --format="%H %ci %s"
          echo "PUAE_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build (Cortex-A53)
        run: |
          cd source
          export CPU_FLAGS="-mcpu=cortex-a53 -mtune=cortex-a53"
          export OPT_FLAGS="-O3 -ffast-math -fomit-frame-pointer -fPIC -flto=auto"
          export CFLAGS="${CPU_FLAGS} ${OPT_FLAGS}"
          export CXXFLAGS="${CFLAGS}"
          export LDFLAGS="-flto=auto"
          make -j$(nproc) \
            platform=unix \
            ARCH=aarch64 \
            CC=${TARGET}-gcc \
            CXX=${TARGET}-g++

      - name: Rename, strip and collect artifact
        run: |
          cd source
          FOUND_FILE=$(find . -maxdepth 1 -name "*.so" | head -n 1)
          if [ -z "${FOUND_FILE}" ]; then
            echo "ERROR: no se genero ningun .so"
            echo "Contenido del directorio tras compilar:"
            ls -F
            exit 1
          fi
          echo "Archivo detectado: ${FOUND_FILE}"
          if [ "${FOUND_FILE}" != "./puae2021_libretro.so" ]; then
            mv "${FOUND_FILE}" puae2021_libretro.so
          fi
          ${TARGET}-strip --strip-unneeded puae2021_libretro.so
          file puae2021_libretro.so

          strings puae2021_libretro.so | grep -E "^[0-9]+\.[0-9]+\.[0-9]+ [0-9a-f]{7}$" | head -1 || true

          mkdir -p ../artifacts
          cp puae2021_libretro.so ../artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: puae2021-libretro-${{ github.event.inputs.branch }}-${{ env.PUAE_COMMIT }}
          path: artifacts/
          retention-days: 30
