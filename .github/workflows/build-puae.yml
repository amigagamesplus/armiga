name: Build PUAE2021 libretro core

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Tag/branch de libretro-uae a compilar'
        required: true
        default: '2.6.1'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Clone libretro-uae
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.branch }}" https://github.com/libretro/libretro-uae.git source
          cd source
          echo ">>> Commit compilado:"
          git log -1 --format="%H %ci %s"
          echo "PUAE_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build (Cortex-A53)
        run: |
          cd source
          export CPU_FLAGS="-mcpu=cortex-a53 -mtune=cortex-a53"
          export OPT_FLAGS="-O3 -ffast-math -fomit-frame-pointer -fPIC -flto=auto"
          export CFLAGS="${CPU_FLAGS} ${OPT_FLAGS}"
          export CXXFLAGS="${CFLAGS}"
          export LDFLAGS="-flto=auto"
          make -j$(nproc) \
            platform=unix \
            ARCH=aarch64 \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++

      - name: Rename, strip and collect artifact
        run: |
          cd source
          FOUND_FILE=$(find . -maxdepth 1 -name "*.so" | head -n 1)
          if [ -z "${FOUND_FILE}" ]; then
            echo "ERROR: no se genero ningun .so"
            echo "Contenido del directorio tras compilar:"
            ls -F
            exit 1
          fi
          echo "Archivo detectado: ${FOUND_FILE}"
          mv "${FOUND_FILE}" puae2021_libretro.so
          aarch64-linux-gnu-strip --strip-unneeded puae2021_libretro.so
          file puae2021_libretro.so

          # Deja constancia de la version+commit exacto embebido en el
          # binario (patron ya usado por post-build.sh via strings sobre
          # el .so, ver PUAE_VER en board/armiga/post-build.sh).
          strings puae2021_libretro.so | grep -E "^[0-9]+\.[0-9]+\.[0-9]+ [0-9a-f]{7}$" | head -1 || true

          mkdir -p ../artifacts
          cp puae2021_libretro.so ../artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: puae2021-libretro-${{ github.event.inputs.branch }}-${{ env.PUAE_COMMIT }}
          path: artifacts/
          retention-days: 30
