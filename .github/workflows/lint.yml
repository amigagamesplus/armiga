# =============================================================================
# armiga — Lint (comprobaciones rapidas en cada push a una rama beta)
# El mismo script se puede ejecutar en local:  bash scripts/ci-lint.sh
# =============================================================================

name: Lint

on:
  push:
    branches: ['v*-beta', 'main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox-static shellcheck

      - name: Lint
        run: bash scripts/ci-lint.sh
