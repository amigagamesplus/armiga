name: Build kernel (Image, dtbs, modules, joypad)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version to build against (e.g. 7.1.8)'
        required: true
        default: '7.1.8'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            build-essential bc bison flex \
            libssl-dev libelf-dev

      - name: Download kernel source
        run: |
          KV="${{ github.event.inputs.kernel_version }}"
          wget -q https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-${KV}.tar.xz
          tar xf linux-${KV}.tar.xz

      - name: Apply Armiga kernel patches
        run: |
          KV="${{ github.event.inputs.kernel_version }}"
          cd linux-${KV}
          for patch in "${GITHUB_WORKSPACE}"/board/armiga/linux/patches/*.patch; do
            if [ -f "$patch" ]; then
              name="$(basename "$patch")"
              case "$name" in
                0005-h616-sram-c-de3-alias-legacy.patch|0006-h616-sram-c-de3-alias-new.patch)
                  if patch -p1 -N --dry-run < "$patch" > /dev/null 2>&1; then
                    echo "Applying $name..."
                    patch -p1 < "$patch"
                  else
                    echo "Skipping $name (not applicable to this kernel version)"
                  fi
                  ;;
                *)
                  echo "Applying $name..."
                  patch -p1 < "$patch"
                  ;;
              esac
            fi
          done

      - name: Copy custom DTS
        run: |
          KV="${{ github.event.inputs.kernel_version }}"
          cd linux-${KV}
          for dts in "${GITHUB_WORKSPACE}"/board/armiga/linux/dts/*.dts; do
            if [ -f "$dts" ]; then
              cp "$dts" arch/arm64/boot/dts/allwinner/
              filename=$(basename -- "$dts")
              dtb_name="${filename%.dts}.dtb"
              if ! grep -q "$dtb_name" arch/arm64/boot/dts/allwinner/Makefile; then
                echo "dtb-\$(CONFIG_ARCH_SUNXI) += $dtb_name" >> arch/arm64/boot/dts/allwinner/Makefile
              fi
            fi
          done

      - name: Adapt kernel config
        run: |
          KV="${{ github.event.inputs.kernel_version }}"
          cp "${GITHUB_WORKSPACE}/board/armiga/linux/linux.aarch64.conf" linux-${KV}/.config
          cd "${GITHUB_WORKSPACE}/board/armiga/linux"
          bash adapt_config.sh
          cp linux.aarch64.conf "${GITHUB_WORKSPACE}/linux-${KV}/.config"

      - name: Build kernel (Image, dtbs, modules)
        run: |
          KV="${{ github.event.inputs.kernel_version }}"
          cd linux-${KV}
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image dtbs modules

      - name: Install in-tree kernel modules
        run: |
          KV="${{ github.event.inputs.kernel_version }}"
          cd linux-${KV}
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- INSTALL_MOD_PATH="${GITHUB_WORKSPACE}/modules_out" modules_install
          echo "=== Installed modules ==="
          find "${GITHUB_WORKSPACE}/modules_out/lib/modules" -name "*.ko" | wc -l

      - name: Build vendored joypad module (rocknix-singleadc-joypad.c, DEVICE=H700)
        run: |
          KV="${{ github.event.inputs.kernel_version }}"
          KERNEL_SRC="${GITHUB_WORKSPACE}/linux-${KV}"
          cd "${GITHUB_WORKSPACE}/board/armiga/linux/rocknix-joypad"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               DEVICE=H700 \
               KERNEL_SRC="${KERNEL_SRC}" \
               -C "${KERNEL_SRC}" \
               M="$(pwd)" modules

      - name: Collect artifacts
        run: |
          KV="${{ github.event.inputs.kernel_version }}"
          mkdir -p kernel-artifacts
          cp "${GITHUB_WORKSPACE}/linux-${KV}/arch/arm64/boot/Image" kernel-artifacts/KERNEL
          DTB_FILE="${GITHUB_WORKSPACE}/linux-${KV}/arch/arm64/boot/dts/allwinner/sun50i-h700-anbernic-rg40xx-h.dtb"
          if [ -f "$DTB_FILE" ]; then
            cp "$DTB_FILE" kernel-artifacts/dtb.img
          fi
          DTB_RG35XX="${GITHUB_WORKSPACE}/linux-${KV}/arch/arm64/boot/dts/allwinner/sun50i-h700-anbernic-rg35xx-h.dtb"
          if [ -f "$DTB_RG35XX" ]; then
            cp "$DTB_RG35XX" kernel-artifacts/dtb-rg35xx-h.img
          fi
          KO="${GITHUB_WORKSPACE}/board/armiga/linux/rocknix-joypad/rocknix-singleadc-joypad.ko"
          cp "$KO" kernel-artifacts/
          MODULES_LIB="${GITHUB_WORKSPACE}/modules_out/lib/modules"
          echo "=== Real modules dir(s) ==="
          ls "${MODULES_LIB}"
          REAL_KVER="$(ls "${MODULES_LIB}" | head -1)"
          echo "REAL_KVER=${REAL_KVER}"
          cp "$KO" "${MODULES_LIB}/${REAL_KVER}/rocknix-singleadc-joypad.ko"
          depmod -a -b "${GITHUB_WORKSPACE}/modules_out" "${REAL_KVER}"
          echo "=== modules.dep entries for joypad ==="
          grep -i joypad "${MODULES_LIB}/${REAL_KVER}/modules.dep" || echo "WARNING: joypad not found in modules.dep"
          tar czf kernel-artifacts/modules-${KV}.tar.gz -C "${GITHUB_WORKSPACE}/modules_out/lib" modules
          echo "=== In-tree modules packaged ==="
          find "$MODULES_LIB" -name "*.ko" | wc -l
          echo "kernel_version=${KV}" > kernel-artifacts/BUILD_INFO.txt
          ls -la kernel-artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.event.inputs.kernel_version }}
          path: kernel-artifacts/
          retention-days: 30
