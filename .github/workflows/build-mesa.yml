name: Build Mesa GBM+Panfrost

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build python3-mako python3-yaml \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libdrm-dev libexpat-dev zlib1g-dev \
            pkg-config bison flex libffi-dev

      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | \
            sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev libclang-rt-21-dev \
            libclc-21-dev spirv-tools
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config \
            /usr/bin/llvm-config-21 100
          llvm-config --version

      - name: Download Mesa
        run: |
          wget -q https://archive.mesa3d.org/mesa-26.0.1.tar.xz
          tar xf mesa-26.0.1.tar.xz

      - name: Install latest Meson
        run: |
          sudo pip3 install meson==1.5.0
          meson --version

      - name: Build SPIRV-Tools 2024.3
        run: |
          git clone -b v2024.3 https://github.com/KhronosGroup/SPIRV-Tools.git
          cd SPIRV-Tools && python3 utils/git-sync-deps && cd ..
          cmake -S SPIRV-Tools -B SPIRV-Tools/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DSPIRV_SKIP_TESTS=ON
          make -C SPIRV-Tools/build -j$(nproc)
          sudo make -C SPIRV-Tools/build install
          pkg-config --modversion SPIRV-Tools || true

      - name: Build SPIRV-LLVM-Translator 21
        run: |
          git clone --depth=1 -b llvm_release_210             https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git
          cmake -S SPIRV-LLVM-Translator -B SPIRV-LLVM-Translator/build             -DCMAKE_BUILD_TYPE=Release             -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm             -DCMAKE_INSTALL_PREFIX=/usr
          make -C SPIRV-LLVM-Translator/build -j$(nproc)
          sudo make -C SPIRV-LLVM-Translator/build install
          pkg-config --modversion LLVMSPIRVLib || true

      - name: Build host mesa_clc
        run: |
          mkdir -p mesa-26.0.1/build-host
          meson setup mesa-26.0.1/build-host mesa-26.0.1 \
            -Dprefix=/usr \
            -Dglvnd=disabled \
            -Dgallium-drivers=panfrost \
            -Dtools=panfrost \
            -Dinstall-mesa-clc=true \
            -Dllvm=enabled \
            -Dmesa-clc=enabled \
            -Dplatforms= \
            -Dprecomp-compiler=enabled \
            -Dglx=disabled \
            -Dvulkan-drivers="" \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dmicrosoft-clc=disabled \
            -Dgallium-rusticl=false \
            -Dvalgrind=disabled \
            -Dlibunwind=disabled
          ninja -C mesa-26.0.1/build-host src/compiler/clc/mesa_clc
          sudo install -m755 mesa-26.0.1/build-host/src/compiler/clc/mesa_clc /usr/local/bin/
          sudo install -m755 mesa-26.0.1/build-host/src/compiler/spirv/vtn_bindgen2 /usr/local/bin/
          mesa_clc --version || true

      - name: Setup aarch64 cross-compilation
        run: |
          # Instalar libdrm para aarch64
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /g' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe" | \
            sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y \
            libdrm-dev:arm64 libexpat-dev:arm64 zlib1g-dev:arm64 \
            libzstd-dev:arm64 libstdc++-11-dev:arm64

      - name: Build target Mesa (aarch64, GBM+panfrost, no X11)
        run: |
          cat > mesa-cross-aarch64.ini << 'CROSSEOF'
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'cortex-a53'
          endian = 'little'
          CROSSEOF

          mkdir -p mesa-26.0.1/build-target
          PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig \
          PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig \
          meson setup mesa-26.0.1/build-target mesa-26.0.1 \
            --cross-file mesa-cross-aarch64.ini \
            -Dprefix=/usr \
            -Dglvnd=disabled \
            -Dgallium-drivers=panfrost \
            -Dplatforms= \
            -Dglx=disabled \
            -Dvulkan-drivers="" \
            -Dgbm=enabled \
            -Degl=enabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dmicrosoft-clc=disabled \
            -Dllvm=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dgallium-rusticl=false \
            -Dvalgrind=disabled \
            -Dlibunwind=disabled \
            -Dzstd=enabled \
            -Dgallium-va=disabled \
            -Dopengl=true
          ninja -C mesa-26.0.1/build-target \
            src/gbm/libgbm.so.1.0.0 \
            src/gallium/targets/dri/panfrost_dri.so \
            src/gbm/backends/dri/dri_gbm.so

      - name: Collect artifacts
        run: |
          mkdir -p mesa-artifacts/usr/lib/dri
          mkdir -p mesa-artifacts/usr/lib/gbm
          cp mesa-26.0.1/build-target/src/gbm/libgbm.so.1.0.0 mesa-artifacts/usr/lib/
          cp mesa-26.0.1/build-target/src/gallium/targets/dri/panfrost_dri.so mesa-artifacts/usr/lib/dri/
          cp mesa-26.0.1/build-target/src/gbm/backends/dri/dri_gbm.so mesa-artifacts/usr/lib/gbm/
          readelf -d mesa-artifacts/usr/lib/dri/panfrost_dri.so | grep NEEDED
          readelf -d mesa-artifacts/usr/lib/gbm/dri_gbm.so | grep NEEDED
          readelf -d mesa-artifacts/usr/lib/libgbm.so.1.0.0 | grep NEEDED

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesa-panfrost-aarch64
          path: mesa-artifacts/
          retention-days: 30
