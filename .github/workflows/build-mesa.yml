name: Build Mesa GBM+Panfrost

on:
  workflow_dispatch:

env:
  MESA_VERSION: "26.2.0"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build python3-mako python3-yaml \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libdrm-dev libexpat-dev zlib1g-dev \
            pkg-config bison flex libffi-dev cmake

      - name: Install Meson
        run: |
          sudo pip3 install meson==1.5.0
          meson --version

      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | \
            sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y \
            llvm-21 llvm-21-dev \
            libclang-rt-21-dev libclang-21-dev libclang-cpp21-dev \
            libclc-21-dev
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config \
            /usr/bin/llvm-config-21 100
          llvm-config --version

      - name: Build SPIRV-Tools from main
        run: |
          git clone --depth=1 https://github.com/KhronosGroup/SPIRV-Tools.git
          cd SPIRV-Tools && python3 utils/git-sync-deps && cd ..
          cmake -S SPIRV-Tools -B SPIRV-Tools/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSPIRV_SKIP_TESTS=ON
          make -C SPIRV-Tools/build -j$(nproc)
          sudo make -C SPIRV-Tools/build install
          pkg-config --modversion SPIRV-Tools

      - name: Build SPIRV-LLVM-Translator 21
        run: |
          git clone --depth=1 -b llvm_release_210 \
            https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git
          cmake -S SPIRV-LLVM-Translator -B SPIRV-LLVM-Translator/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DCMAKE_INSTALL_PREFIX=/usr
          make -C SPIRV-LLVM-Translator/build -j$(nproc)
          sudo make -C SPIRV-LLVM-Translator/build install
          pkg-config --modversion LLVMSPIRVLib

      - name: Download Mesa
        run: |
          wget -q https://gitlab.freedesktop.org/mesa/mesa/-/archive/mesa-${{ env.MESA_VERSION }}/mesa-mesa-${{ env.MESA_VERSION }}.tar.gz
          tar xf mesa-mesa-${{ env.MESA_VERSION }}.tar.gz
          mv mesa-mesa-${{ env.MESA_VERSION }} mesa-${{ env.MESA_VERSION }}

      - name: Build host mesa_clc
        run: |
          mkdir -p mesa-${{ env.MESA_VERSION }}/build-host
          meson setup mesa-${{ env.MESA_VERSION }}/build-host mesa-${{ env.MESA_VERSION }} \
            -Dprefix=/usr \
            -Dglvnd=disabled \
            -Dgallium-drivers=panfrost \
            -Dtools=panfrost \
            -Dinstall-mesa-clc=true \
            -Dllvm=enabled \
            -Dmesa-clc=enabled \
            -Dplatforms= \
            -Dprecomp-compiler=enabled \
            -Dglx=disabled \
            -Dvulkan-drivers="" \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dmicrosoft-clc=disabled \
            -Dgallium-rusticl=false \
            -Dvalgrind=disabled \
            -Dlibunwind=disabled
          ninja -C mesa-${{ env.MESA_VERSION }}/build-host src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
          sudo install -m755 mesa-${{ env.MESA_VERSION }}/build-host/src/compiler/clc/mesa_clc /usr/local/bin/
          sudo install -m755 mesa-${{ env.MESA_VERSION }}/build-host/src/compiler/spirv/vtn_bindgen2 /usr/local/bin/
          sudo install -m755 mesa-${{ env.MESA_VERSION }}/build-host/src/panfrost/clc/panfrost_compile /usr/local/bin/
          mesa_clc --version || true

      - name: Setup aarch64 cross-compilation
        run: |
          sudo mkdir -p /sysroot-aarch64
          cd /tmp
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /g' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe" | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update -qq
          apt-get download libdrm2:arm64 libdrm-dev:arm64 libexpat1:arm64 libexpat1-dev:arm64 zlib1g:arm64 zlib1g-dev:arm64 libzstd1:arm64 libzstd-dev:arm64 libc6:arm64 libc6-dev:arm64 linux-libc-dev:arm64 || true
          for deb in /tmp/*.deb; do sudo dpkg-deb -x $deb /sysroot-aarch64 || true; done
          ls /sysroot-aarch64/usr/lib/aarch64-linux-gnu/ | head -10

      - name: Build target Mesa (aarch64, GBM+panfrost, no X11)
        run: |
          cat > mesa-cross-aarch64.ini << 'CROSSEOF'
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'cortex-a53'
          endian = 'little'
          CROSSEOF

          mkdir -p mesa-${{ env.MESA_VERSION }}/build-target
          PKG_CONFIG_PATH=/sysroot-aarch64/usr/lib/aarch64-linux-gnu/pkgconfig \
          PKG_CONFIG_LIBDIR=/sysroot-aarch64/usr/lib/aarch64-linux-gnu/pkgconfig \
          PKG_CONFIG_SYSROOT_DIR=/sysroot-aarch64 \
          meson setup mesa-${{ env.MESA_VERSION }}/build-target mesa-${{ env.MESA_VERSION }} \
            --cross-file mesa-cross-aarch64.ini \
            -Dprefix=/usr \
            -Dglvnd=disabled \
            -Dgallium-drivers=panfrost \
            -Dplatforms= \
            -Dglx=disabled \
            -Dvulkan-drivers="" \
            -Dgbm=enabled \
            -Degl=enabled \
            -Dgles1=disabled \
            -Dgles2=enabled \
            -Dshared-glapi=enabled \
            -Dmicrosoft-clc=disabled \
            -Dllvm=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dgallium-rusticl=false \
            -Dvalgrind=disabled \
            -Dlibunwind=disabled \
            -Dzstd=disabled
          ninja -C mesa-${{ env.MESA_VERSION }}/build-target

      - name: Collect artifacts
        run: |
          echo "Instalando en un directorio temporal para recolectar los artefactos generados..."
          mkdir -p target-install
          DESTDIR=$PWD/target-install ninja -C mesa-${{ env.MESA_VERSION }}/build-target install
          
          mkdir -p mesa-artifacts/usr/lib/gbm
          
          # A partir de Mesa 24.2/25.0, libgallium_dri.so y panfrost_dri.so HAN SIDO ELIMINADOS.
          # Ahora libEGL y libgbm cargan directamente libgallium-<version>.so.
          find target-install -name "libgbm.so*" -exec cp -a {} mesa-artifacts/usr/lib/ \;
          find target-install -name "libEGL.so*" -exec cp -a {} mesa-artifacts/usr/lib/ \;
          find target-install -name "libGLESv2.so*" -exec cp -a {} mesa-artifacts/usr/lib/ \;
          find target-install -name "libgallium-*.so" -exec cp -a {} mesa-artifacts/usr/lib/ \;
          
          find target-install -name "dri_gbm.so" -exec cp -L {} mesa-artifacts/usr/lib/gbm/ \; || true
          
          echo "Artefactos recolectados:"
          ls -R mesa-artifacts/
          
          # Verificación básica
          if [ -f mesa-artifacts/usr/lib/libgbm.so.1.0.0 ]; then
            readelf -d mesa-artifacts/usr/lib/libgbm.so.1.0.0 | grep NEEDED || true
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesa-panfrost-aarch64
          path: mesa-artifacts/
          retention-days: 30
