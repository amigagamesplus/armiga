name: Build MangoHud ARM64 (KMS/DRM + GLES)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite lanzarlo manualmente desde la pestaña Actions

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MangoHud Repository
        uses: actions/checkout@v4
        with:
          repository: flightlessmango/MangoHud
          submodules: recursive

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Build MangoHud inside ARM64 Container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:22.04 bash -c "
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y \
                build-essential \
                python3-pip \
                ninja-build \
                python3-mako \
                pkg-config \
                libdrm-dev \
                libegl1-mesa-dev \
                libgles2-mesa-dev \
                libdbus-1-dev \
                glslang-tools \
                git

              python3 -m pip install --upgrade meson

              meson setup build \
                -Dwith_x11=disabled \
                -Dwith_wayland=disabled \
                -Dwith_nvml=disabled \
                -Dwith_xnvctrl=disabled \
                --buildtype release

              ninja -C build
            "

      - name: Upload MangoHud Binaries
        uses: actions/upload-artifact@v4
        with:
          name: mangohud-arm64-so
          path: |
            build/src/libMangoHud_opengl.so
            build/src/libMangoHud.so
