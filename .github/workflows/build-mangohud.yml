name: Build MangoHud ARM64 (KMS/DRM + GLES)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MangoHud Repository
        uses: actions/checkout@v4
        with:
          repository: flightlessmango/MangoHud
          submodules: recursive

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Build MangoHud inside ARM64 Container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:22.04 bash -c "
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y \
                build-essential \
                python3-pip \
                ninja-build \
                python3-mako \
                pkg-config \
                libvulkan-dev \
                libdrm-dev \
                libegl1-mesa-dev \
                libgles2-mesa-dev \
                libdbus-1-dev \
                glslang-tools \
                libwayland-dev \
                wayland-protocols \
                libxkbcommon-dev \
                git

              # Soluciona el error de permisos de Git
              git config --global --add safe.directory /workspace

              # Instala la última versión de Meson (> 1.7.0) mediante pip
              pip3 install meson

              # Llamamos al ejecutable directamente desde donde pip lo instaló
              /usr/local/bin/meson setup build \
                -Dwith_x11=disabled \
                -Dwith_wayland=enabled \
                -Dwith_nvml=disabled \
                -Dwith_xnvctrl=disabled \
                --buildtype release

              ninja -C build
            "

      - name: Upload MangoHud Binaries
        uses: actions/upload-artifact@v4
        with:
          name: mangohud-arm64-so
          path: build/src/*.so
          if-no-files-found: warn
