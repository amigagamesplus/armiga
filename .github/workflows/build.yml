# =============================================================================
# Armiga — GitHub Actions Build Workflow
# =============================================================================

name: Build Armiga

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Crear release con la imagen'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      buildroot_version:
        description: 'Versión de Buildroot'
        required: false
        default: '2026.02.2'
        type: string

env:
  BR_VERSION: ${{ github.event.inputs.buildroot_version || '2026.02.2' }}
  BR_EXTERNAL: ${{ github.workspace }}
  BR_DL_DIR: ${{ github.workspace }}/dl
  BR_OUTPUT: ${{ github.workspace }}/output

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout Armiga
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential wget cpio unzip rsync bc \
            python3 python3-pip libssl-dev \
            file gawk texinfo bison flex \
            exfatprogs \
            libncurses-dev \
            dosfstools mtools \
            gdisk \
            libconfuse-dev \
            nlohmann-json3-dev \
            cmake
          wget -q https://github.com/pengutronix/genimage/releases/download/v17/genimage-17.tar.xz
          tar xf genimage-17.tar.xz
          cd genimage-17
          ./configure
          make -j$(nproc)
          sudo make install
          cd ..
          rm -rf genimage-17 genimage-17.tar.xz

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .buildroot-ccache
          key: ccache-${{ env.BR_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.BR_VERSION }}-

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ env.BR_VERSION }}-${{ hashFiles('configs/armiga_defconfig') }}
          restore-keys: |
            dl-${{ env.BR_VERSION }}-

      - name: Cache Buildroot toolchain
        uses: actions/cache@v4
        with:
          path: output/host
          key: toolchain-${{ env.BR_VERSION }}-mesa-panfrost-v1-${{ hashFiles('configs/armiga_defconfig') }}
          restore-keys: |
            toolchain-${{ env.BR_VERSION }}-

      - name: Download Buildroot
        run: |
          wget -q "https://buildroot.org/downloads/buildroot-${BR_VERSION}.tar.xz"
          tar xf "buildroot-${BR_VERSION}.tar.xz"
          mv "buildroot-${BR_VERSION}" buildroot





      - name: Configure Buildroot
        run: |
          make BR2_EXTERNAL="${BR_EXTERNAL}" \
               -C buildroot \
               O="${BR_OUTPUT}" \
               armiga_defconfig



      - name: Inject Mesa GBM into staging
        run: |
          SYSROOT="${{ github.workspace }}/output/host/aarch64-buildroot-linux-gnu/sysroot"
          OVERLAY="${{ github.workspace }}/board/armiga/rootfs_overlay"
          mkdir -p "$SYSROOT/usr/lib/pkgconfig" "$SYSROOT/usr/include"
          cp "$OVERLAY/usr/lib/libgbm.so.1.0.0" "$SYSROOT/usr/lib/"
          ln -sf libgbm.so.1.0.0 "$SYSROOT/usr/lib/libgbm.so"
          ln -sf libgbm.so.1.0.0 "$SYSROOT/usr/lib/libgbm.so.1"
          sudo apt-get install -y libgbm-dev
          cp /usr/include/gbm.h "$SYSROOT/usr/include/"
          mkdir -p "$SYSROOT/usr/lib/pkgconfig"
          printf 'prefix=/usr\nlibdir=${prefix}/lib\nincludedir=${prefix}/include\nName: gbm\nDescription: Mesa GBM library\nVersion: 26.1.2\nLibs: -L${libdir} -lgbm\nCflags: -I${includedir}\n' > "$SYSROOT/usr/lib/pkgconfig/gbm.pc"
          # Inject nlohmann/json headers into sysroot (descarga release completo)
          wget -q https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp -O "$SYSROOT/usr/include/nlohmann/json.hpp" || true
          wget -q https://github.com/nlohmann/json/archive/refs/tags/v3.11.3.tar.gz -O /tmp/nlohmann.tar.gz
          tar xf /tmp/nlohmann.tar.gz -C /tmp
          cp -r /tmp/json-3.11.3/include/nlohmann "$SYSROOT/usr/include/"
          echo "GBM staging inject OK"

      - name: Build
        run: |
          make BR2_EXTERNAL="${BR_EXTERNAL}" \
               BR2_DL_DIR="${BR_DL_DIR}" \
               -C "${BR_OUTPUT}" \
               -j$(nproc)

      - name: List images
        run: |
          echo "=== Imágenes generadas ==="
          ls -lh "${BR_OUTPUT}/images/"
          echo ""
          echo "=== Tamaño sdcard.img ==="
          du -h "${BR_OUTPUT}/images/sdcard.img" || echo "sdcard.img no encontrado"

      - name: Upload SD image
        uses: actions/upload-artifact@v4
        with:
          name: armiga-sdcard-${{ github.run_number }}
          path: output/images/sdcard.img
          compression-level: 9
          retention-days: 30

      - name: Create Release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Armiga Build #${{ github.run_number }}"
          body: |
            ## Armiga Build #${{ github.run_number }}

            - Buildroot: ${{ env.BR_VERSION }}
            - Kernel: 7.0.2-armiga
            - Commit: ${{ github.sha }}

            ### Flash
            sudo dd if=sdcard.img of=/dev/sdX bs=4M status=progress conv=fsync
            sudo sgdisk -e /dev/sdX
            sync
          files: output/images/sdcard.img
          draft: false
          prerelease: true
