# =============================================================================
# Armiga — GitHub Actions Build Workflow
# =============================================================================

name: Build Armiga

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Crear release con la imagen'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      buildroot_version:
        description: 'Versión de Buildroot'
        required: false
        default: '2026.02.2'
        type: string

env:
  BR_VERSION: ${{ github.event.inputs.buildroot_version || '2026.02.2' }}
  BR_EXTERNAL: ${{ github.workspace }}
  BR_DL_DIR: ${{ github.workspace }}/dl
  BR_OUTPUT: ${{ github.workspace }}/output

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # --- Checkout del repo ---
      - name: Checkout Armiga
        uses: actions/checkout@v4

      # --- Instalar dependencias de host ---
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential wget cpio unzip rsync bc \
            python3 python3-pip libssl-dev \
            file gawk texinfo bison flex \
            exfatprogs \
            libncurses-dev \
            dosfstools mtools \
            gdisk \
            libconfuse-dev

          # genimage no está en Ubuntu 22.04 — compilar desde fuente
          wget -q https://github.com/pengutronix/genimage/releases/download/v17/genimage-17.tar.xz
          tar xf genimage-17.tar.xz
          cd genimage-17
          ./configure
          make -j$(nproc)
          sudo make install
          cd ..
          rm -rf genimage-17 genimage-17.tar.xz

      # --- Cache de ccache ---
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .buildroot-ccache
          key: ccache-${{ env.BR_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.BR_VERSION }}-

      # --- Cache de descargas ---
      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ env.BR_VERSION }}-${{ hashFiles('configs/armiga_defconfig') }}
          restore-keys: |
            dl-${{ env.BR_VERSION }}-

      # --- Descargar Buildroot ---
      - name: Download Buildroot
        run: |
          wget -q "https://buildroot.org/downloads/buildroot-${BR_VERSION}.tar.xz"
          tar xf "buildroot-${BR_VERSION}.tar.xz"
          mv "buildroot-${BR_VERSION}" buildroot

      # --- Parchear Mesa3D para eliminar dependencia de LLVM ---
      - name: Patch Mesa3D remove LLVM dependency
        run: |
          sed -i '/^\tdepends on BR2_PACKAGE_MESA3D_LLVM$/d' \
            buildroot/package/mesa3d/Config.in
          sed -i '/^comment ".*needs llvm"$/,/^\tdepends on !BR2_PACKAGE_MESA3D_LLVM$/d' \
            buildroot/package/mesa3d/Config.in
          sed -i '/^\tspirv-tools \\/d' \
            buildroot/package/mesa3d/mesa3d.mk
          sed -i '/^\tspirv-llvm-translator \\/d' \
            buildroot/package/mesa3d/mesa3d.mk

      # --- Configurar ---
      - name: Configure Buildroot
        run: |
          make BR2_EXTERNAL="${BR_EXTERNAL}" \
               -C buildroot \
               O="${BR_OUTPUT}" \
               armiga_defconfig

      # --- Build ---
      - name: Build
        run: |
          make BR2_EXTERNAL="${BR_EXTERNAL}" \
               BR2_DL_DIR="${BR_DL_DIR}" \
               -C "${BR_OUTPUT}" \
               -j$(nproc)

      # --- Listar resultados ---
      - name: List images
        run: |
          echo "=== Imágenes generadas ==="
          ls -lh "${BR_OUTPUT}/images/"
          echo ""
          echo "=== Tamaño sdcard.img ==="
          du -h "${BR_OUTPUT}/images/sdcard.img" || echo "sdcard.img no encontrado"

      # --- Upload artifact ---
      - name: Upload SD image
        uses: actions/upload-artifact@v4
        with:
          name: armiga-sdcard-${{ github.run_number }}
          path: output/images/sdcard.img
          compression-level: 9
          retention-days: 30

      # --- Release (opcional) ---
      - name: Create Release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Armiga Build #${{ github.run_number }}"
          body: |
            ## Armiga Build #${{ github.run_number }}

            - Buildroot: ${{ env.BR_VERSION }}
            - Kernel: 7.0.2-armiga
            - Commit: ${{ github.sha }}

            ### Flash
```bash
            sudo dd if=sdcard.img of=/dev/sdX bs=4M status=progress conv=fsync
            sudo sgdisk -e /dev/sdX
            sync
```
          files: output/images/sdcard.img
          draft: false
          prerelease: true
